name: Link check

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source links in the dataset
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --accept 200,201,204,206,301,302,403,429 'src/data/**/*.yaml'
          fail: false
          output: lychee/out.md
      - name: Open an issue when links break
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken source links
          content-filepath: lychee/out.md
          labels: data, links

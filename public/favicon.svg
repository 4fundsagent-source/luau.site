<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .f { color: #0b0b0c; }
    @media (prefers-color-scheme: dark) { .f { color: #ededef; } }
  </style>
  <g class="f">
    <defs>
      <pattern id="h" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="2.6" stroke="currentColor" stroke-width="1.1"/>
      </pattern>
      <clipPath id="c"><circle cx="12" cy="12" r="8"/></clipPath>
    </defs>
    <g clip-path="url(#c)">
      <rect x="4" y="4" width="8" height="16" fill="currentColor"/>
      <rect x="12" y="4" width="8" height="16" fill="url(#h)"/>
    </g>
    <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/>
  </g>
</svg>

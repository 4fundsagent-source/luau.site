    released: "~2024-12"
    notes: >-
      The README listed v1.6 by December 2024, then v1.6.1 (March 21, 2025) and v1.6.2 (April 16,
      2025). Watermarked "Hercules v1.6.2" in obfuscated output.
    sources:
      - url: https://github.com/zeusssz/hercules-obfuscator/commits/main
        title: Commit history — README version bumps, December 2024 to April 2025
        accessed: 2026-10-04

# Luraph — https://lura.ph
name: Luraph
vendor: Luraph
since: 2017
tagline: Long-running commercial VM obfuscator for Lua and Luau, with API bindings and a macro SDK.
description: >-
  Luraph describes itself as the longest-standing Lua obfuscation service, active since 2017.
  It compiles scripts to a per-build virtual machine, and offers macros, a VS Code extension and
  API bindings for .NET and Node.js. It guarantees support for the latest patches of every major Lua
  release since 5.1, LuaJIT and Luau, with extra handling for platforms such as Roblox and FiveM, and
  pricing starts at $1 per obfuscation. In 2026 the v14.7–v14.9 line was publicly devirtualized, and
  two open-source deobfuscators for v15 appeared about six weeks after its August release. Luraph
  shipped v15.1 on October 2, 2026.
website: https://lura.ph
discord: https://discord.lura.ph
repo: https://github.com/Luraph
pricing: paid
# Ships numbered releases (v14.7 … v15.1) that the community can track.
disclosure: public
# Per the FAQ: "the latest patches of all major Lua releases after v5.1, LuaJIT, and Luau".
targets: [luau, lua51, lua52, lua53, lua54, luajit]
techniques: [vm, polymorphic-vm, const-encryption, string-encryption, cff, anti-tamper, macros]
# Release dates from Luraph's Discord announcements, as reported by the luau.site maintainers.
versions:
  - version: "14.7"
    released: 2026-02-16
    notes: >-
      Added SMALL_INTEGERS (32-bit integers on Lua 5.3/5.4); up to 30% faster obfuscation of large
      scripts, smaller constant serialization, faster LPH_ENCFUNC and deserialization on Luau, and
      anti-tamper improvements.
  - version: "14.8"
    released: 2026-03-25
    notes: Improved internal key generation; fixed random errors on Roblox.
  - version: "14.9"
    released: 2026-08-06
  - version: "15"
    released: 2026-08-11
    notes: Released for the Node.js platform only at first.
    sources:
      - url: https://lura.ph/dashboard/documents/v15
        title: Luraph v15 documentation (dashboard)
        accessed: 2026-10-04
  - version: "15.1"
    released: 2026-10-02
    notes: Reported by the luau.site maintainers; changelog link pending.
verified: false
lastVerified: 2026-10-04
sources:
  - url: https://github.com/Luraph
    title: Luraph on GitHub — "committed to Lua obfuscation since 2017"
    accessed: 2026-10-03
  - url: https://lura.ph/dashboard/faq
    title: Luraph FAQ — supported Lua versions, "9 years of development", pricing from $1 per obfuscation
    accessed: 2026-10-04
  - url: https://github.com/Luraph/macrosdk
    title: Luraph macro SDK
    accessed: 2026-10-03

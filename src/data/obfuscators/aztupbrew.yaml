name: AztupBrew
tagline: Fork of IronBrew 2 that kept its Lua 5.1 VM design; public tools reverse it alongside IronBrew.
description: >-
  AztupBrew is a fork of IronBrew 2 published as version 2.7.2, continuing IronBrew's 2.7.x
  numbering. It keeps the IronBrew-style Lua 5.1 VM, so tools built for IronBrew handle it with small
  changes: one open-source deobfuscator recovers readable source from it, and an older one lifts it
  back to Lua bytecode. Pricing and distribution are not documented yet.
segment: legacy
pricing: unknown
basedOn: ironbrew-2
targets: [lua51]
techniques: [vm]
versions:
  - version: "2.7.2"
verified: false
lastVerified: 2026-10-03
sources:

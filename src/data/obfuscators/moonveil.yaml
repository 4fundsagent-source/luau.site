name: MoonVeil
tagline: Luau-first obfuscator with a uniquely generated VM per script and fine-grained protection macros.
description: >-
  MoonVeil generates a hardened Luau interpreter for every script, with its own instruction set,
  shuffled opcode encoding and hot-patched mnemonics, picked from several VM implementations. It also
  flattens control flow into an opaque state machine and runs an IR optimizer before protecting.
  Authors choose what to protect with macros such as MV_VM, MV_ENC_FUNC and MV_CFF, or skip blocks
  with MV_OMIT, and macro aliases let it stand in for competitors' macros. Paid plans add environment
  checks aimed at debuggers and environment loggers. The free tier allows 2 requests a day with
  control-flow flattening and a limited set of VM instruction sets; Basic ($7 a month) and Commercial
  ($30 a month) unlock every VM type and a "Safe Env" compiling mode, and all plans include a web API.
  MoonVeil publishes no changelog or release history, so its versions surface only through third
  parties. In 2026 an open-source devirtualizer listed MoonVeil v1.4.5 as supported; maintainers
  report that this break was far easier than Luraph v15's.
website: https://moonveil.cc
docs: https://git.openpunk.com/CPunch/MoonVeil-Docs
since: 2025
pricing: freemium
# No public changelog or release history; versions surface only through third parties.
disclosure: none
targets: [luau]
techniques: [vm, polymorphic-vm, function-encryption, cff, env-checks, macros]

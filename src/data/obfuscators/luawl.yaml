name: luawl
tagline: Server-gated Luau runtime obfuscator (a DRM) — a fresh, polymorphic build per execution. Crackme unsolved, $150 bounty.
description: >-
  luawl describes itself as a DRM rather than a file obfuscator. Scripts are obfuscated per execution
  and delivered from its servers at runtime, so there is no static file to save and no loadstring to
  hook, and replayed responses are rejected. Code runs on a highly polymorphic stack VM, every user and
  execution gets a different build, the vendor says it updates daily, and it uses white-box
  cryptography plus server-side tracking of tamper flags. It also claims self-attestable,
  enclave-based servers. These are the vendor's claims from its release post and website, where luawl
  says each run goes through a custom Lua VM on a non-standard instruction set and returns a new,
  uniquely obfuscated build. luawl is in heavy beta and access starts with a demo request. Plans are a
  free Starter tier with credit-based obfuscations, Basic at $4 a month and Pro at $11 a month (both
  billed yearly). A public changelog has dated updates rather than version numbers, from the
  protected execution model (January 20, 2026) to verification records for each run (July 23,
  2026). Its static protections can be tested with a public crackmes.one challenge
  (luawl-challenge-v1.2, run with Lune), rated 5.4/6 for difficulty and unsolved with a $150 bounty
  as of October 4, 2026, after 541 downloads and no writeups. The challenge's labels, set by luawl's
  own uploader account, list string encryption, runtime decryption, a VM, control-flow obfuscation
  and a state-machine dispatcher.

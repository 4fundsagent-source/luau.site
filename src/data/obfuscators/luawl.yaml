name: luawl
tagline: Server-gated Luau runtime obfuscator (a DRM) — a fresh, polymorphic build per execution. Crackme unsolved, $150 bounty.
description: >-
  luawl describes itself as a DRM rather than a file obfuscator. Scripts are obfuscated per execution
  and delivered from its servers at runtime, so there is no static file to save and no loadstring to
  hook, and replayed responses are rejected. Code runs on a highly polymorphic stack VM, every user and
  execution gets a different build, the vendor says it updates daily, and it uses white-box
  cryptography plus server-side tracking of tamper flags. It also claims self-attestable,
  enclave-based servers. These are the vendor's claims from its release post. luawl is in heavy beta
  and access is by request only (a demo is requested by email). Its static protections can be tested
  with a public crackmes.one challenge (luawl-challenge-v1.2, run with Lune), rated 5.4/6 for
  difficulty and unsolved with a $150 bounty as of October 3, 2026.
website: https://luawl.org
pricing: unknown
availability: request-only
beta: true
targets: [luau]
# As claimed in the vendor's r/lua release post.
techniques: [vm, polymorphic-vm, runtime-delivery, whitebox-crypto, anti-tamper]

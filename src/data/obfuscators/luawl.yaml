name: luawl
tagline: Server-gated Luau runtime obfuscator (a DRM).
description: >-
  luawl obfuscates at runtime: a loader requests each run from its servers, where the script is
  virtualized on a custom, non-standard Lua VM and returned as a fresh build, so there is no static
  file to save. Its protected execution model launched on January 20, 2026; later changelog updates
  changed delivery and verification, not the obfuscation. A public crackmes.one challenge
  (luawl-challenge-v1.2) is rated 5.4/6 and still unsolved, with a $150 bounty.
website: https://luawl.org
vendor: Luawl, Inc.
since: 2026
pricing: freemium
# Dated changelog entries, but no version numbers.
disclosure: public
availability: request-only
beta: true
targets: [luau]
# vm … anti-tamper as claimed in the vendor's r/lua release post; cff and string-encryption from the
# labels luawl's own account set on its crackmes.one challenge.
techniques: [vm, polymorphic-vm, runtime-delivery, whitebox-crypto, cff, string-encryption, anti-tamper]
challenges:
  - title: luawl-challenge-v1.2
    platform: crackmes.one
    url: https://crackmes.one/crackme/6a84e079184836c0dbe7d836
    posted: 2026-08-18
    version: v1.2
    difficulty: 5.4
    difficultyScale: 6
    quality: 5.1
    downloads: 541
    writeups: 0
    bounty: $150
    status: open
    accessed: 2026-10-04
    sources:
      - url: https://crackmes.one/crackme/6a84e079184836c0dbe7d836
        title: crackmes.one — luawl-challenge-v1.2 (difficulty, quality, downloads and writeups)
        accessed: 2026-10-04
# The obfuscation has not changed since the January release; later changelog entries are about
# delivery and verification, so they are not tracked as versions.
versions:
  - version: current
    released: 2026-01-20
    notes: >-
      The protected execution model from luawl's first changelog entry. Later updates (March to July
      2026) covered loader authorization, run receipts and verification, not the obfuscation.
    sources:
      - url: https://luawl.org/changelog
        title: luawl changelog — "Protected execution model", January 20, 2026
        accessed: 2026-10-04
verified: false
lastVerified: 2026-10-04

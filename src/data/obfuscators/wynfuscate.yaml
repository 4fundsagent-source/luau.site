name: Wynfuscate
tagline: Luau obfuscator for Roblox that powers KeyForge's hosted protection; 20 free obfuscations a month, unlimited from $10.
description: >-
  Wynfuscate (styled wYnFuscate) is the obfuscator behind KeyForge, a Roblox key-system and licensing
  platform: scripts saved to a KeyForge dashboard are obfuscated on save and served through its
  loader. KeyForge's plans include 20 Wynfuscate obfuscations a month free, 50 at $3, 70 at $5 and
  unlimited at $10 or $20 a month. Wynfuscate's own site announced it in 2025 as a Luau and Lua
  obfuscator for Roblox in which every protected script runs on its own custom virtual machine, with
  "metamorphic code generation", proprietary encryption and anti-tamper. Those are the vendor's
  pre-launch claims; its current site sits behind a bot check. No dedicated deobfuscator exists, but
  from about August 1, 2026 frontier AI models could deobfuscate v4 scripts without any tooling. v5
  followed on August 7 with a staged roll-out (beta testers, then Enterprise, Pro and Basic; free
  users stayed on v4), and no deobfuscation of v5 is known.
website: https://wynfuscate.com
since: 2025
pricing: freemium
targets: [luau]
# As claimed on the vendor's 2025 pre-launch page.
techniques: [vm, polymorphic-vm, anti-tamper]

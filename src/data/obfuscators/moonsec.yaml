name: MoonSec
tagline: Long-running Lua obfuscation service; its v3 is one of the most deobfuscated targets in the scene.
description: >-
  MoonSec is a Lua obfuscator used across Roblox and FiveM scripting. Several public tools target
  MoonSec v3, from constant dumpers and an open-source devirtualizer that lifts it back to Lua 5.1
  bytecode, to a deobfuscation service that also claims v2 support. An older open-source tool
  devirtualizes v2. Pricing, supported runtimes and current version are not yet documented here.
segment: legacy
pricing: unknown
targets: []
techniques: [vm]
versions:
  - version: "2"
  - version: "3"
    notes: >-
      Most widely targeted version. Release date unknown; it was already named in a repository created
      in May 2023, and a deobfuscation service for it was announced in September 2023.
verified: false
lastVerified: 2026-10-04

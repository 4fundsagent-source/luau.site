name: IronBrew1
tagline: Paid hosted Lua obfuscator with a generated VM, control-flow scrambling, SSA optimization and anti-tamper, from $10 a month.
description: >-
  IronBrew1 (styled Ironbrew1) is an account-based obfuscation service. Scripts are compiled into a
  custom instruction format and run on a generated virtual machine, branches and VM paths are
  scrambled, an SSA optimizer simplifies code before the protection passes, and runtime checks stop
  execution if the VM has been modified. Premium adds "intense VM scrambling" and VM compression.
  Macros such as IB_ENCSTR (encrypted strings), IB_NO_VIRTUALIZE, IB_INLINE and IB_CRASH control
  protection per function or string. Plans are Basic ($10 a month, 600 builds, platform lock and
  anti-tamper), Premium ($20 a month, 1,500 builds) and Premium + API (from $35 a month, required to
  obfuscate scripts for third parties). The web uploader takes .lua and .luau files, but the site
  publishes no runtime list or changelog and does not describe a link to the original IronBrew or
  IronBrew 2. No public deobfuscator or deobfuscation service is known, so it earns credit for every
  day it stays that way.
website: https://ironbrew1.com

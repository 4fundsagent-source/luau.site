name: WeAreDevs Obfuscator
tagline: Free hosted Lua obfuscator from the WeAreDevs exploit community, running unmodified Prometheus.
description: >-
  WeAreDevs offers a free web obfuscator for Roblox scripts. Its page says obfuscation is handled by
  the open-source Prometheus obfuscator, used as a backend without modifying its source code; which
  Prometheus preset or settings it applies is not published. Deobfuscator authors still refer to its
  output as a "wearedevs fork" of Prometheus, and several tools handle both. An open-source
  trace-based tool has recovered readable Lua and string constants from WeAreDevs scripts since
  December 2025. Versions are not published, so it is tracked as a single current version.
website: https://wearedevs.net/obfuscator
segment: legacy
pricing: free
basedOn: prometheus
targets: [luau]
# Unmodified Prometheus, but the preset WeAreDevs runs is not published, so no techniques are claimed.
techniques: []
versions:
  - version: current
verified: false
lastVerified: 2026-10-04

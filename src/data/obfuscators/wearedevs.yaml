name: WeAreDevs Obfuscator
tagline: Free hosted Lua obfuscator from the WeAreDevs exploit community, built on Prometheus.
description: >-
  WeAreDevs offers a free web obfuscator for Roblox scripts. Public deobfuscators describe its output
  as a Prometheus fork ("supports wearedevs fork + latest version"), and several of them handle both.
  An open-source trace-based tool has recovered readable Lua and string constants from WeAreDevs
  scripts since December 2025. Versions are not published, so it is tracked as a single current version.

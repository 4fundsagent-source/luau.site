name: Clyde
tagline: Open-source Luau obfuscator with stack- and register-based VMs, written in TypeScript.
description: >-
  Clyde parses full Luau (types, generics, if-expressions, string interpolation), applies multi-pass
  AST transformations and compiles to one of two VM architectures, stack-based or register-based. It
  has three levels: Debug (named opcodes), Normal (shuffled opcode mapping, encoded constants) and
  Maximum (polymorphic dispatch, LZMA-compressed bytecode, anti-tamper). It ships a CLI and a web UI.
  The README warns that others have rebranded Clyde as their own product, and says a V3 is in
  development.
repo: https://github.com/sfr-development/Lua-Obfuscator-Clyde-Protection
since: 2026
pricing: open-source
license: MIT
targets: [luau]
techniques: [vm, polymorphic-vm, string-encryption, renaming, cff, opaque-predicates, anti-tamper, compression]
codebase:
  vm: 2
  randomization: 2
  antiTamper: 1
  luau: 3
  maintenance: 1
  notes: >-
    Preliminary grade. Two VM back-ends and per-build opcode shuffling with polymorphic dispatch;
    anti-tamper only at the Maximum level; broad Luau grammar coverage. Eight commits, quiet from June
    to October 2026, with V3 announced.
  assessedOn: 2026-10-03
versions:
  - version: main
    notes: Rolling releases from the main branch. V3 is announced as in development.
verified: false
lastVerified: 2026-10-04

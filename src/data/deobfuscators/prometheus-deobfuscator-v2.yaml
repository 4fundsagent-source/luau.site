name: Prometheus-DeobfuscatorV2
author: "0x251"
tagline: Static-plus-dynamic Prometheus deobfuscator, built to test AI-assisted reverse engineering.
description: >-
  Static passes peel common layers first (constant-array decoding, string decryption, proxy-local
  unwrapping), then an optional sandboxed trace runs the script and records calls. VM
  devirtualization is "dynamic-first". The author presents it as research software built to test
  GPT-5-driven reverse-engineering workflows, and warns the sandbox is not a security boundary.

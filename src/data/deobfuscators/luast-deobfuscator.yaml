name: luast-deobfuscator
author: HamieXD
tagline: Offline Luast v1.0.1 deobfuscator that inverts its stream ciphers, with AI-assisted reconstruction.
description: >-
  A dependency-free Python engine that extracts Luast's constant pool, inverts its 7-round 32-bit seed
  mixer, decrypts all four stream-cipher variants and replays the runtime index permutations, then
  rebuilds the script. An AGENTS.md workflow lets AI coding agents run the whole process and restore
  names and structure. Ground-truth samples for protection levels 1, 2 and 3 are reported as exact matches.
repo: https://github.com/HamieXD/luast-deobfuscator
access: open-source
license: MIT
techniques: [constant-dump, ast-cleanup, ai-assisted]
outputLevel: readable

name: Deobfuscator-Luraph-V15
author: caomod2077
tagline: Open-source pipeline that lifts Luraph v15 scripts back to readable Luau.
description: >-
  A five-stage pipeline: AST analysis maps the VM dispatcher and closure makers; a sandboxed
  offline Roblox emulator neutralizes crash traps; a live Luau REPL decrypts constants on demand;
  symbolic evaluation rebuilds if/else, while, for and repeat-until; and an SSA pass names variables
  using Roblox API patterns. Scripts of 500–750+ functions take one to two minutes. A fast
  trace mode (--no-devirt) finishes in seconds but skips full lifting. Experimental v14.7–v14.9
  support landed on September 28, 2026, falling back to execution traces.
repo: https://github.com/caomod2077/Deobfuscator-Luraph-V15
access: open-source
license: MIT
techniques: [static-devirt, emulation, dynamic-trace, constant-dump]
outputLevel: near-original
# Public by this date: issue #1 was opened on the repository.
firstSeen: 2026-09-26
maintenance: active
targets:
  - obfuscator: luraph
    versions: ["15"]
    support: full
    difficulty: hard
  - obfuscator: luraph
    versions: ["14.7", "14.8", "14.9"]
    support: experimental
    since: 2026-09-28
    difficulty: hard
    notes: Partial support with fallback to execution traces.
verified: false
lastVerified: 2026-10-03
